# Nav2 参数 - 针对 ARM Cortex-A53 优化
# 所有顶层 key 带 robot_1/ 前缀（匹配节点 FQN，否则参数不加载）
# 补充 smoother_server / velocity_smoother / waypoint_follower 参数段

robot_1/amcl:
  ros__parameters:
    transform_tolerance: 5.0
    autostart: true

robot_1/bt_navigator:
  ros__parameters:
    autostart: true
    transform_tolerance: 5.0
    global_frame: map
    robot_base_frame: robot_1/base_link
    odom_topic: /robot_1/odom
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node

robot_1/controller_server:
  ros__parameters:
    autostart: true
    transform_tolerance: 5.0
    global_frame: robot_1/odom
    robot_base_frame: robot_1/base_link
    odom_topic: /robot_1/odom
    controller_frequency: 10.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      max_vel_x: 0.25
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      min_speed_theta: 0.8
      max_speed_xy: 0.25
      acc_lim_x: 0.25
      acc_lim_y: 0.0
      acc_lim_theta: 3.0
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      vx_samples: 10
      vy_samples: 3
      vtheta_samples: 10
      sim_time: 1.0
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.1
      stateful: True
      critics: ["Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

robot_1/planner_server:
  ros__parameters:
    autostart: true
    transform_tolerance: 5.0
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5

robot_1/smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

robot_1/behavior_server:
  ros__parameters:
    autostart: true
    transform_tolerance: 5.0
    global_frame: robot_1/odom
    robot_base_frame: robot_1/base_link
    odom_topic: /robot_1/odom
    costmap_topic: /robot_1/local_costmap/costmap
    footprint_topic: /robot_1/local_costmap/footprint
    cycle_frequency: 10.0

robot_1/waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

robot_1/velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.6]
    min_velocity: [-0.35, 0.0, -1.2]
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.5, 0.0, -2.0]
    odom_topic: /robot_1/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

robot_1/local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 3.0
      publish_frequency: 2.0
      global_frame: robot_1/odom
      robot_base_frame: robot_1/base_link
      transform_tolerance: 5.0
      resolution: 0.05
      rolling_window: true
      width: 2
      height: 2
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /robot_1/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.20
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.11, -0.09], [-0.11, 0.09]]"

robot_1/global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: robot_1/base_link
      update_frequency: 0.5
      publish_frequency: 1.0
      transform_tolerance: 5.0
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /robot_1/map
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /robot_1/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.20
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.11, -0.09], [-0.11, 0.09]]"      