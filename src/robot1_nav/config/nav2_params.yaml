robot1:
  amcl:
    ros__parameters:
      use_sim_time: False
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: "robot1/base_link"
      odom_frame_id: "robot1/odom"
      global_frame_id: "map"
      scan_topic: "scan"
      max_particles: 2000
      min_particles: 500
      pf_err: 0.05
      pf_z: 0.99
      robot_model_type: "differential"

  local_costmap:
    local_costmap:
      ros__parameters:
        update_frequency: 5.0
        publish_frequency: 2.0
        global_frame: robot1/odom
        robot_base_frame: robot1/base_link
        use_sim_time: False
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.15
        plugins: ["voxel_layer", "inflation_layer"]
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: True
          publish_voxel_map: True
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: True
          cost_scaling_factor: 5.0
          inflation_radius: 0.55

  global_costmap:
    global_costmap:
      ros__parameters:
        update_frequency: 1.0
        publish_frequency: 1.0
        global_frame: map
        robot_base_frame: robot1/base_link
        use_sim_time: False
        robot_radius: 0.15
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          enabled: True
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /scan
            clearing: True
            marking: True
            data_type: "LaserScan"
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          enabled: True
          cost_scaling_factor: 5.0
          inflation_radius: 0.55

  bt_navigator:
    ros__parameters:
      use_sim_time: False
      global_frame: map
      robot_base_frame: robot1/base_link
      odom_topic: /robot1/odom

  planner_server:
    ros__parameters:
      use_sim_time: False
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.5
        use_astar: False

  controller_server:
    ros__parameters:
      use_sim_time: False
      controller_plugins: ["FollowPath"]
      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
