robot1/ekf_filter_node:
  ros__parameters:
    # Lowered from 30Hz — on this ARM board EKF couldn't keep up at 30
    # (you saw 'Failed to meet update rate' warnings). 20Hz matches
    # controller_server and is well within capability.
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: robot1/odom
    base_link_frame: robot1/base_link
    world_frame: robot1/odom
    odom0: odom
    odom0_config: [false, false, false, false, false, false, true, true, false, false, false, false, false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    imu0: imu/data_raw
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, true, false, false]
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true
