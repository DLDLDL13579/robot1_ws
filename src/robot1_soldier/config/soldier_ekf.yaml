robot_1/ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.5          # 放宽超时阈值，防止偶发卡顿触发报错
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: robot_1/odom
    base_link_frame: robot_1/base_link
    world_frame: robot_1/odom
    
    odom0: odom
    # 履带车横向无位移，关闭 vy (第7位)，仅保留 vx (第6位)
    odom0_config: [false, false, false, false, false, false, true, false, false, false, false, false, false, false, false]
    odom0_queue_size: 2          # 核心优化：从 10 降为 2，防止数据积压拖垮 CPU
    odom0_differential: false
    odom0_relative: false
    
    imu0: imu/data_raw
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 2           # 核心优化：从 10 降为 2
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true